{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "knp.fullname" . }}
  labels:
    {{- include "knp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      {{- if .Values.clusterNetworkPolicy.enabled }}
      - nodes
      {{- end }}
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list, watch]
  {{- if .Values.clusterNetworkPolicy.enabled }}
  - apiGroups: [policy.networking.k8s.io]
    resources: [clusternetworkpolicies]
    verbs: [list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "knp.fullname" . }}
  labels:
    {{- include "knp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "knp.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "knp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
